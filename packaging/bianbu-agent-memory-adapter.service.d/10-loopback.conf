# Hand-written override: systemd merges drop-ins on top of the unit file, so this
# ExecStart wins even when a hand-copied /etc/systemd/system/...adapter.service
# shadows the packaged unit (systemd prefers /etc over /usr/lib for fragments).
# The HTTP endpoint authenticates nobody, so the adapter must stay on loopback.
# Keep this line identical to the unit's ExecStart: debian/tests/validate-package-metadata.sh
# compares the two so the copies cannot drift apart silently.
[Service]
ExecStart=
ExecStart=/usr/bin/bianbu-agent-memory-adapter --socket /run/bianbu/agent-memoryd.sock --registry-dir /run/bianbu/agent-runtime/memory-registry --secret-file /etc/bianbu-agent-memory/adapter-confirmation.secret --host 127.0.0.1 --port 5168
