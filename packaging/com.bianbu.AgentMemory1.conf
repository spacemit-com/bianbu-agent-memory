<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="bianbu-memory">
    <allow own="com.bianbu.AgentMemory1"/>
  </policy>
  <policy context="default">
    <!-- The control interface plus the two standard read-only interfaces a
         client needs in order to discover it.  Everything on
         com.bianbu.AgentMemory1 is still authenticated by the daemon itself
         against the Runtime registration registry, so this only widens
         discovery, not authority. -->
    <allow send_destination="com.bianbu.AgentMemory1"
           send_interface="com.bianbu.AgentMemory1"/>
    <allow send_destination="com.bianbu.AgentMemory1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.bianbu.AgentMemory1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
