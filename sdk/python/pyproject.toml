[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bianbu-agent-memory"
version = "0.1.6"
description = "Local UDS client for bianbu-agent-memoryd"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dplus = ["mem0ai==2.0.17"]
mcp = ["mcp>=1.9,<2"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "mcp>=1.9,<2"]

[project.scripts]
bianbu-agent-memory-dplus = "bianbu_agent_sdk.memory.dplus_service:main"
bianbu-agent-memory = "bianbu_agent_sdk.memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
