[workspace]
members = [
    "crates/memory-core",
    "crates/memory-protocol",
    "crates/memory-store",
    "crates/memoryd",
]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
flate2 = "1"
hex = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["socket", "user"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zbus = { version = "5", features = ["blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
